apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: evaluation-service-secret
  namespace: evaluation-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: evaluation-service-secret
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: evaluation-service-dev/redis-url
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: evaluation-service-dev/service-api-key
